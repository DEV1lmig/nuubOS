# nuubOS Terminal (nuubos-termd): foot for root's login shell, fullscreen
# under labwc. Text size changes with L2/R2 (Ctrl+keypad -/+), L3 resets.
[main]
term=xterm-256color
font=DejaVu Sans Mono:size=9
dpi-aware=no
pad=6x6

[bell]
urgent=no
notify=no

[scrollback]
lines=2000

[cursor]
style=block
blink=no

[colors-dark]
background=111316
foreground=e6e8eb
