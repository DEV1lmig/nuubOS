# nuubOS Product Audio graph.
# ALSA and Bluetooth A2DP are both managed by WirePlumber so every Product
# Audio stream shares one PipeWire graph and can be mixed without preemption.
wireplumber.profiles = {
  main-embedded = {
    monitor.bluez = required
    monitor.bluez.seat-monitoring = disabled
    monitor.bluez-midi = disabled
    custom.nuubos-app-volume = required
  }
}

# Applications volume on every new application stream (nuubos-app-volume.lua).
wireplumber.components = [
  {
    name = nuubos-app-volume.lua, type = script/lua
    provides = custom.nuubos-app-volume
  }
]

wireplumber.settings = {
  linking.allow-moving-streams = true
  linking.follow-default-target = true
}
