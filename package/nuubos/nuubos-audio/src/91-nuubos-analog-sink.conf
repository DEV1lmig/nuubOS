# nuubOS H700 analog playback endpoint.
# The H700 codec exposes a mono ALSA PCM. ACP currently enumerates the card but
# does not create a playback node for it, so expose the hardware explicitly as
# a standard PipeWire ALSA adapter. PipeWire owns mixing/resampling.
#
# High-resolution music (user request 2026-10-12): the codec takes S16/S32
# at 8..48, 96 and 192 kHz (sun4i-codec H616 DAI). The sink runs 32-bit and
# the graph follows the rate of what plays when it starts (44.1 kHz CD rips,
# 96/192 kHz FLAC) instead of resampling everything to 48 kHz; 88.2/176.4 kHz
# sources are resampled to 96/192. The sink has no fixed audio.rate (it
# would pin the format): the graph starts at 48 kHz and switches when a
# stream asks for another allowed rate while nothing else runs; system
# sounds are resampled meanwhile. Hardware-checked on the CubeXX 2026-10-12
# (hw_params 96000/44100 S32_LE while playing).
context.properties = {
  default.clock.rate = 48000
  default.clock.allowed-rates = [ 44100 48000 96000 192000 ]
}
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = api.alsa.pcm.sink
      node.name = "nuubos_analog"
      node.description = "nuubOS Analog Audio"
      media.class = "Audio/Sink"
      node.latency = "256/48000"
      api.alsa.path = "hw:Codec,0"
      api.alsa.period-size = 256
      api.alsa.headroom = 0
      api.alsa.disable-mmap = false
      api.alsa.disable-batch = false
      audio.format = "S32LE"
      audio.allowed-rates = [ 44100 48000 96000 192000 ]
      audio.channels = 1
      audio.position = [ MONO ]
      # Never suspend (close) the codec PCM when idle. Re-opening it on the
      # first cue after ~5 s of silence delayed that cue and re-ran codec
      # power-up (audible pop on the speaker). An idle, open PCM is not
      # scheduled: measured 0 wakeups/0 CPU ticks over 10 s on RG40XX-V.
      session.suspend-timeout-seconds = 0
    }
  }
]
