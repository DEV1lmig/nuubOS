# Product Audio streams own their own software gain in nuubos-audiod.
# Keep them at unity even when the global Applications volume is below 100%.
# The Media application's music ("nuubOS Music", nuubos-mediad) has its own
# Music volume in the player: the Applications (game) volume never scales it,
# so the Quick Menu mixer can balance a game against the music.
stream.rules = [
  {
    matches = [
      { application.process.binary = "nuubos-audio-wav-player" }
      { application.name = "nuubOS Music" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
        state.default-volume = 1.0
      }
    }
  }
]
