<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>nuubOS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" hidden>
  <form class="box" id="login-form" autocomplete="on">
    <div class="brand"><span class="brand-mark"></span></div>
    <div class="tag" id="login-tag"></div>
    <div class="field">
      <label for="login-user" id="login-user-label"></label>
      <input class="input" id="login-user" name="username" autocomplete="username" value="root" spellcheck="false" autocapitalize="off">
    </div>
    <div class="field">
      <label for="login-password" id="login-password-label"></label>
      <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off">
    </div>
    <div class="err" id="login-error" role="alert"></div>
    <button class="btn" id="login-submit" type="submit"></button>
    <div class="note" id="login-note"></div>
  </form>
</div>

<header id="top" hidden>
  <div class="brand"><button class="back only-narrow" id="menu-button" type="button"></button><span class="brand-mark"></span><span class="avatar" id="top-avatar"></span></div>
  <div id="clock"></div>
  <div class="status" id="top-status"></div>
</header>

<main id="app" hidden>
  <nav id="railwrap"><h1 id="rail-title"></h1><div id="rail" role="navigation"></div></nav>
  <section id="pane"><div id="page"></div></section>
</main>

<footer id="hints" hidden></footer>
<div id="toasts" aria-live="polite"></div>
<div id="scrim" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
