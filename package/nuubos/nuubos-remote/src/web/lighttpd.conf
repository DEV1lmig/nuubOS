# nuubOS Web administration (EPIC-038).
#
# HTTPS only: port 80 just redirects. The certificate is per device and
# self-signed (nuubos-web-cert, created by nuubos-remotectl). Static files
# are the web application; /api/ goes to nuubos-admind, which checks the
# session opened with the device credential on every request. lighttpd
# reads the key as root at start, then runs as www-data.
server.modules = ( "mod_access", "mod_alias", "mod_redirect", "mod_setenv",
                   "mod_openssl", "mod_proxy" )
server.document-root = "/usr/share/nuubos/web"
server.port = 443
server.username = "www-data"
server.groupname = "www-data"
server.pid-file = "/var/run/nuubos-web.pid"
server.errorlog = "/run/nuubos/web.log"
server.tag = ""
server.upload-dirs = ( "/tmp" )
# Disc images can be large (KB); bodies stream to nuubos-admind with
# backpressure (stream-request-body 2: no temporary files), which writes
# them straight into place.
server.max-request-size = 8388608
server.stream-request-body = 2
server.stream-response-body = 2
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8",
                    ".js" => "text/javascript; charset=utf-8",
                    ".css" => "text/css; charset=utf-8",
                    ".svg" => "image/svg+xml",
                    ".png" => "image/png",
                    ".otf" => "font/otf",
                    ".webmanifest" => "application/manifest+json" )

ssl.engine = "enable"
ssl.pemfile = "/state/remote/web-cert.pem"
ssl.privkey = "/state/remote/web-key.pem"
ssl.openssl.ssl-conf-cmd = ( "MinProtocol" => "TLSv1.2" )

$SERVER["socket"] == ":80" {
    ssl.engine = "disable"
    url.redirect = ( "" => "https://${url.authority}${url.path}${qsa}" )
    url.redirect-code = 308
}

# The interface font of nuubUI (Cantarell, SIL OFL 1.1).
alias.url = ( "/fonts/" => "/usr/share/fonts/cantarell/" )

proxy.server = ( "/api/" => ( ( "host" => "/run/nuubos/admin.sock" ) ) )

setenv.add-response-header = (
    "X-Frame-Options" => "DENY",
    "X-Content-Type-Options" => "nosniff",
    "Referrer-Policy" => "no-referrer",
    "Cross-Origin-Opener-Policy" => "same-origin",
    "Permissions-Policy" => "camera=(), microphone=(), geolocation=()",
    "Content-Security-Policy" => "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" )
# nuubos-admind sets its own Cache-Control (no-store) on /api/.
$HTTP["url"] =^ "/api/" {
}
else {
    setenv.add-response-header += ( "Cache-Control" => "no-cache" )
}
