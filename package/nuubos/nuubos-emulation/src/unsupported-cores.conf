# Cores of the libretro buildbot (linux/aarch64) that do not run on nuubOS.
#
#   core  # reason
#
# Get More Emulators does not offer them (nuubos-libretroctl) and a copy
# downloaded anyway (RetroArch's Online Updater, nuubOS 1.0.0-rc.3) is not
# one of the system's emulators (nuubos-emud): a game set to it starts with
# the system's default. Checked 2026-10-28 on the CubeXX (GitHub #22). The
# bundled -nuubOS builds of the same emulators are not affected.
#
# A core whose libraries are missing is refused anyway (core-check.h); it
# is listed here so that it is not offered for download.

bsnes             # needs libgomp (OpenMP)
desmume           # desktop OpenGL (libGL)
flycast           # desktop OpenGL and libgomp; Flycast-nuubOS is bundled
kronos            # desktop OpenGL (libGL)
mednafen_psx_hw   # desktop OpenGL (libGL)
mupen64plus_next  # desktop OpenGL (libGL); Mupen64Plus-Next-nuubOS is bundled
parallel_n64      # crashes at start (SIGSEGV) with GLES; ParaLLEl N64-nuubOS is bundled
ppsspp            # desktop OpenGL and GLX; PPSSPP-nuubOS is bundled
yabasanshiro      # desktop OpenGL (libGL); YabaSanshiro-nuubOS is bundled
