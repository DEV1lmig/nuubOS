# nuubOS one-time updates of core option defaults (nuubos-emud, EPIC-013).
#
#   id|key|old_value|new_value
#
# retroarch-core-options.cfg reaches existing users only for keys they do
# not have, and RetroArch saves every option of a core it ran, so a changed
# default needs an entry here: at the next launch emud sets key to
# new_value in the user's core options if it still holds old_value (the old
# default: a value the user chose is kept), and records id in
# <user>/appdata/retroarch/core-option-updates so it is applied once.
# Never reuse an id.
2026-10-14-psp-autoframeskip|ppsspp_auto_frameskip|disabled|enabled
2026-10-14-psp-frameskip|ppsspp_frameskip|disabled|2
2026-10-18-nds-touch-joystick|melonds_touch_mode|Joystick|disabled
