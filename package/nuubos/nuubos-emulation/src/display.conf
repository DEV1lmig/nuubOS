# nuubOS screen type of each system (nuubos-emud, EPIC-013).
#
#   system|screen[|hdmi_lines[|square_crop]]
#
# hdmi_lines (optional): lines RetroArch renders a game of the system at on
# HDMI, at most its logical window (1280x720 on a 1080p TV at output scale
# 1.5), scaled to the TV mode by the display engine; missing = 720, 0 =
# native resolution. 720 holds 240p content at an integer 3x (GBA 4x) with
# the CRT look's full scanlines; full speed measured 2026-10-18 for nes
# snes megadrive pcengine psx gba gbc n64 psp nds (a true 1080-line buffer
# saturates the GPU: CRT systems 38-42 fps). User: "720p + upscale a 1080p
# andava bene". Before that crt systems rendered 480 lines (2.25x) and the
# others 360. The 3D-heavy saturn/dreamcast/naomi/atomiswave stay at 360
# (not measured).
#
# square_crop (optional, crt systems on a square handheld screen only):
# percentage of the picture's width that may be cropped so it fills the
# screen height (a TV's overscan, split evenly between the sides); missing
# = 8. An empty hdmi_lines keeps its default (system|crt||6).
#
# crt       TV or monitor with visible scanlines at low resolution: the CRT
#           look applies (Settings -> Gaming -> CRT Effect), TV bezel.
# lcd       handheld screen: never the CRT look, handheld bezel.
# monitor   high resolution / VGA / vector display: no CRT look, TV bezel.
#
# Systems missing here are "monitor". Bezel colours come from systems.conf.
