# nuubOS systems in the libretro databases.
#
#   system|database[|database...]
#
# system: id from /usr/share/nuubos/systems.conf. database: a libretro
# database name, as in the "database" field of the libretro core-info files
# and the folder names of the libretro cheat collection.
#
# - Get More Emulators (Game Settings) offers the cores of the libretro
#   buildbot whose core-info names one of these databases; a core
#   downloaded for a system is one of its emulators (nuubos-emud).
# - Cheats come from the folders of these names in the libretro cheat
#   collection (/userdata/cheats/libretro/<database>, nuubos-libretroctl).
#
# A system without a line gets no other emulators and no cheat collection
# (the MAME machine systems need their reduced MAME core).

