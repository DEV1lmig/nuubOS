# nuubOS core option defaults (EPIC-013), copied once per user. Only
# options whose upstream default is not the best choice on H700; every
# other option keeps the core's own default.
mgba_skip_bios = "ON"
gambatte_gb_colorization = "auto"
# Nintendo 64: GLideN64 at 320x240 (Mali-G31 fill rate). The renderer
# runs on its own core (A53 x4) and framebuffers are never read back into
# emulated RDRAM: GPU readbacks stall Panfrost's pipeline and the software
# depth copy costs a core (only a few effects, e.g. sun coronas, need them).
# Nintendo 64 buttons (user report 2026-10-21: in Mario Kart 64 R2 "used
# items and changed the view"): both cores' own layout makes R2 a modifier
# that turns the face buttons into C buttons. Independent C buttons instead,
# no modifier: L2 = Z, R2 = R, L1/R1 = C-left/C-right, the other two face
# buttons = C-down/C-up, Select = L, a right stick = C buttons.
parallel-n64-alt-map = "enabled"
mupen64plus-alt-map = "True"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-43screensize = "320x240"
mupen64plus-ThreadedRenderer = "True"
mupen64plus-EnableCopyColorToRDRAM = "Off"
mupen64plus-EnableCopyDepthToRDRAM = "Off"
# No hybrid upscaling filter (a full-screen shader pass on Mali-G31) and a
# smaller texture cache limit (1500 instead of 8000 MB: 1 GB console).
mupen64plus-HybridFilter = "False"
mupen64plus-MaxTxCacheSize = "1500"
# ParaLLEl N64 (the N64 default since 2026-10-18, user decision): gln64 at
# native 320x240, low accuracy. On the CubeXX it holds full speed where
# Mupen64Plus-Next/GLideN64 does not (F-Zero X 41 -> 60, Doom 64 45 -> 50,
# Mortal Kombat 4 32 -> 50) and looks close to it (Rice: wrong colours).
# Its own default renderer is GLideN64, which this build leaves out.
parallel-n64-gfxplugin = "gln64"
parallel-n64-screensize = "320x240"
parallel-n64-gfxplugin-accuracy = "low"
# PSP: native 480x272, no GPU readbacks, lazy texture hashing, cheap
# splines (PPSSPP's own low-end profile).
ppsspp_internal_resolution = "480x272"
ppsspp_skip_gpu_readbacks = "enabled"
ppsspp_lazy_texture_caching = "enabled"
ppsspp_spline_quality = "Low"
ppsspp_lower_resolution_for_effects = "Safe"
# No anisotropic filtering (core default 16x): +10 % frames on God of War,
# no visible gain at native resolution.
ppsspp_texture_anisotropic_filtering = "disabled"
# Auto frameskip, at most 1 frame in a row, and the nuubOS dynamic CPU
# clock (PPSSPP-nuubOS patch 0004, 2026-10-18; the user found 2 skipped
# frames in a row too choppy): a game the H700 cannot emulate at 60
# vblanks gets a lower emulated CPU clock and draws fewer frames at its own
# speed instead of slow motion. God of War: Chains of Olympus fights: 60
# vblanks, 30 fps drawn (was 42 vblanks / 14 drawn with frameskip 2).
ppsspp_auto_frameskip = "enabled"
ppsspp_frameskip = "1"
ppsspp_nuubos_dynamic_clock = "enabled"
# Nintendo DS: ARM64 JIT, threaded software renderer. Frameskip auto
# (nuubOS patch 0001, 2026-10-17): skips drawing one frame in two only while
# the emulation falls behind (3D games are CPU-bound on the A53); new key, so
# existing users get it through the missing-key merge.
# Touch screen (no touch panel on H700 handhelds, 2026-10-18): the nuubOS
# stylus mode (Game Hotkeys "Stylus", patch 0015) moves a cursor with the
# right stick, left stick or D-pad and touches with L2; the upstream touch
# modes are off (their cursor was always drawn).
# Accuracy fast (melonDS-nuubOS patch 0011, replaces the CPU sync interval):
# the geometry engine runs each command at once and the CPUs synchronise
# every 512 cycles; Game Settings can make a game Accurate.
melonds_jit_enable = "enabled"
melonds_threaded_renderer = "enabled"
melonds_touch_mode = "disabled"
melonds_nuubos_stylus = "off"
melonds_frameskip = "auto"
melonds_accuracy = "fast"
# PlayStation (PCSX ReARMed, NEON software GPU): 3D drawn at twice the
# native resolution (user decision 2026-10-18). Gran Turismo 2, Ape Escape,
# Tekken 3, CTR, Final Fantasy VII, Resident Evil hold 50 (PAL) either way
# on the CubeXX; the busiest thread stays near a third of a core. Since
# 2026-10-27 emud sets it for every session: Game Settings -> Resolution,
# Auto = 1x on the handheld screen, 2x on HDMI (this value only matters to
# RetroArch run outside emud).
pcsx_rearmed_neon_enhancement_enable = "enabled"
# Commodore: disk/tape autostart in warp, otherwise a 1541 load at real
# speed shows LOADING for minutes before the game.
vice_autoloadwarp = "enabled"
# Dreamcast, NAOMI, Atomiswave (Flycast-nuubOS): automatic frameskip (patch
# 0004): a frame is neither read nor drawn, never two in a row, while
# RetroArch's audio buffer runs low; the game keeps its speed (user goal
# 2026-10-21: full speed at 640x480, some accuracy may go). VGA cable: every
# game at 60 Hz (a TV cable puts PAL games on 50 Hz interlaced).
reicast_frame_skipping = "auto"
# Translucent polygons sorted per triangle (user decision 2026-10-27,
# GitHub #16: per strip draws smoke, glass and water in the wrong order;
# Game Settings -> Emulation Accuracy -> Fast puts per strip back for a game).
reicast_alpha_sorting = "per-triangle (normal)"
reicast_cable_type = "VGA (RGB)"
