<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  nuubOS: font caches on the system slot instead of /var/cache, which is a
  link to tmpfs. There they were rebuilt at every boot (47 MB of fonts
  scanned) while labwc waited for them: ~1.9 s before the UI could start
  (boot audit 2026-10-22). Written once, at the first start of a slot.
-->
<fontconfig>
	<cachedir>/var/lib/fontconfig</cachedir>
</fontconfig>
