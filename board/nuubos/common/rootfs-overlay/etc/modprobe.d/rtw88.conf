# RTL8821CS (SDIO) Deep LPS (LCLK) between beacons.
# Disabled from v0.5 to 2026-10-14: on the RG35XX Pro (older kernel) the
# firmware was seen not acknowledging the RPWM request for Deep Power mode.
# Under qualification again on 7.3 (battery audit 2026-10-14): the failure
# shows as "firmware failed to ack driver for entering Deep Power mode" in
# dmesg (platform test H4 counts it); set Y again if it comes back.
options rtw88_core disable_lps_deep=N
