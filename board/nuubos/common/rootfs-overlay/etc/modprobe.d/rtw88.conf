# RTL8821CS (SDIO) Deep LPS (LCLK) between beacons: disabled.
# On the RG35XX Pro the firmware does not acknowledge the RPWM request to
# leave LPS ("firmware failed to leave lps state" every ~2 s, "failed to
# send h2c command"): Wi-Fi drops during Steam Link and Syncthing. Seen on
# v0.5 (older kernel) and again on 7.3-rc7 after re-enabling it on
# 2026-10-14 (2026-10-17: 41 errors in 2.5 min with N, none with Y).
# Platform test H4 counts the failure.
options rtw88_core disable_lps_deep=Y
